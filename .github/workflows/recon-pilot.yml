name: recon-pilot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/recon_pilot.py --self-test
      - run: python scripts/recon_pilot.py --pilot --output pilot-evidence
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recon-pilot-evidence
          path: pilot-evidence
          retention-days: 14
